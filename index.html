<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jam-Pak EDU</title>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Jamaican-themed animated background -->
  <div class="bg-canvas">
    <div class="stripe stripe-1"></div>
    <div class="stripe stripe-2"></div>
    <div class="leaves leaves-tl"></div>
    <div class="leaves leaves-br"></div>
    <div class="music-bg">
      <span class="music-note" style="--sz:2.8rem;top:7%;left:4%;--dur:9s;--delay:0s">♪</span>
      <span class="music-note" style="--sz:1.8rem;top:18%;left:13%;--dur:12s;--delay:1.2s">♫</span>
      <span class="music-note" style="--sz:3rem;top:6%;left:83%;--dur:8s;--delay:0.4s">♩</span>
      <span class="music-note" style="--sz:2rem;top:22%;left:90%;--dur:11s;--delay:2s">♬</span>
    </div>
  </div>

  <div id="app">
    <noscript>JavaScript is required to run Jam-Pak EDU.</noscript>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
